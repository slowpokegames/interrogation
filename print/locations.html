<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interrogation · Location Cards</title>
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/print.css">
<style>
  .cards { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 2.95in); border: 1px dashed #999; }
  .card { border: 1px dashed #999; padding: 0.16in; display: flex; }
  .inner { flex: 1; border: 3px solid var(--c); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 0.9in 1fr; grid-template-rows: auto 1fr auto; gap: 4px 12px; }
  .icon { grid-row: span 2; }
  .icon svg { width: 0.9in; height: 0.9in; }
  .name { font: 700 19pt/1 var(--head); text-transform: uppercase; letter-spacing: .03em; color: var(--c); align-self: end; }
  .blurb { font: 400 9.5pt/1.3 var(--type); color: var(--muted); }
  .action { grid-column: 1 / -1; font-size: 9.5pt; border-top: 1px solid var(--line); padding-top: 6px; }
  .pip { position: relative; float: right; }
  .pip svg { width: 0.5in; height: 0.5in; }
  .note { margin-top: 8px; }
</style>
</head>
<body>
<div class="screen-bar"><a href="index.html">← Printables</a><button onclick="print()">Print</button></div>
<div class="page">
  <div class="brandline"><span class="logo">Interrogation</span><span class="what">Location Cards</span></div>
  <div class="cards" id="cards"></div>
  <p class="small muted note">Cut along the dashed lines. Lay the cards in the middle of the table. When picking destinations with dice, the die face shows where you're going.</p>
</div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/art.js"></script>
<script>
(function () {
  var D = GameData, A = Art;
  var colors = ["#c47f00", "#d61f6f", "#a88400", "#0a8fa6", "#c2418d", "#7b3fd1"];
  var actions = {
    1: "One report on the killer's <b>outfit</b>. Several detectives here? All see the same single report.",
    2: "One report on the <b>sound stage</b> where it happened, shared by everyone here.",
    3: "One report on the killer's <b>voice</b>, shared by everyone here.",
    4: "<b>Alone:</b> a crime lab estimate of the hour of death <i>or</i> an action card. <b>With company:</b> everyone gets the same lab reading.",
    5: "<b>Announced openly</b>, never picked in secret. <b>Alone:</b> take a Box of Donuts. <b>With company:</b> trade information.",
    6: "Make a <b>press release</b> (+10 / −5) or <b>name the perpetrator</b> and go to trial (+16 / −12)."
  };
  var PIPS = { 1: [[2, 2]], 2: [[1, 1], [3, 3]], 3: [[1, 1], [2, 2], [3, 3]], 4: [[1, 1], [3, 1], [1, 3], [3, 3]],
               5: [[1, 1], [3, 1], [2, 2], [1, 3], [3, 3]], 6: [[1, 1], [3, 1], [1, 2], [3, 2], [1, 3], [3, 3]] };
  function die(n, c) {
    return '<svg viewBox="0 0 40 40"><rect x="1.5" y="1.5" width="37" height="37" rx="8" fill="#fff" stroke="' + c + '" stroke-width="3"/>' +
      PIPS[n].map(function (p) { return '<circle cx="' + p[0] * 10 + '" cy="' + p[1] * 10 + '" r="3.6" fill="' + c + '"/>'; }).join("") + "</svg>";
  }
  document.getElementById("cards").innerHTML = D.LOCATIONS.map(function (l) {
    var c = colors[l.n - 1];
    return '<div class="card" style="--c:' + c + '"><div class="inner"><div class="icon">' + A.locationIcon(l.n, false) + "</div>" +
      '<div class="name"><span class="pip">' + die(l.n, c) + "</span>" + l.name + '</div><div class="blurb">' + l.blurb + "</div>" +
      '<div class="action">' + actions[l.n] + "</div></div></div>";
  }).join("");
})();
</script>
</body>
</html>
